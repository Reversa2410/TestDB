# =====================================================================
# Cadena de conexion (Requerimiento C)
# Ajustar al servidor y las credenciales disponibles en el laboratorio.
# =====================================================================

# --- Opcion 1: autenticacion de Windows (la que esta activa) ---------
# Necesita mssql-jdbc_auth-<version>.x64.dll en la carpeta lib,
# que es lo que hacen compilar.bat y ejecutar.bat.
jdbc.url=jdbc:sqlserver://localhost;databaseName=BD_Comercializadora;integratedSecurity=true;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false

# --- Opcion 2: usuario y contrasena de SQL Server --------------------
# Comentar la linea de arriba, descomentar estas tres y poner la clave.
#jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=BD_Comercializadora;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false
#jdbc.usuario=sa
#jdbc.clave=TuClave

# --- Por que sendStringParametersAsUnicode=false ----------------------
# Por defecto el driver envia todo String como nvarchar(4000). Como las
# columnas de la tabla son varchar, eso obliga a SQL Server a una
# conversion implicita en cada parametro y, en un WHERE, impide usar el
# indice (busqueda por rastreo en vez de por busqueda). Con este ajuste
# los parametros viajan como varchar y coinciden con el tipo declarado.

# --- Otras variantes utiles ------------------------------------------
# Instancia SQL Express:
#   jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=BD_Comercializadora;integratedSecurity=true;encrypt=true;trustServerCertificate=true
# Servidor remoto con puerto explicito:
#   jdbc:sqlserver://192.168.1.50:1433;databaseName=BD_Comercializadora;encrypt=true;trustServerCertificate=true
