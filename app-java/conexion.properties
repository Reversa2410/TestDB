# =====================================================================
# Cadena de conexion (Requerimiento C)
# Ajustar al servidor y las credenciales disponibles en el laboratorio.
# =====================================================================

# --- Opcion 1: autenticacion de Windows (la que esta activa) ---------
# Necesita mssql-jdbc_auth-<version>.x64.dll en la carpeta lib,
# que es lo que hacen compilar.bat y ejecutar.bat.
jdbc.url=jdbc:sqlserver://localhost;databaseName=BD_Comercializadora;integratedSecurity=true;encrypt=true;trustServerCertificate=true

# --- Opcion 2: usuario y contrasena de SQL Server --------------------
# Comentar la linea de arriba, descomentar estas tres y poner la clave.
#jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=BD_Comercializadora;encrypt=true;trustServerCertificate=true
#jdbc.usuario=sa
#jdbc.clave=TuClave

# --- Otras variantes utiles ------------------------------------------
# Instancia SQL Express:
#   jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=BD_Comercializadora;integratedSecurity=true;encrypt=true;trustServerCertificate=true
# Servidor remoto con puerto explicito:
#   jdbc:sqlserver://192.168.1.50:1433;databaseName=BD_Comercializadora;encrypt=true;trustServerCertificate=true
